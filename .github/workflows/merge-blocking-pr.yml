name: merge-blocking-pr
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -G Ninja
      - name: Build
        run: cmake --build build
      - name: Run tests (if any)
        run: |
          if [ -f "build/tests" ]; then ./build/tests; fi
      # This job will set a required status check; GitHub will block merging if it fails.
