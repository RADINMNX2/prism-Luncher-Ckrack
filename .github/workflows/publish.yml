name: publish
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Java (for Maven Central publishing if needed)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build artifacts
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -G Ninja
          cmake --build build --config Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated release for ${{ github.ref_name }}"
          draft: false
          prerelease: false
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: prismlauncher-binaries
          path: build/**/prismlauncher*   
