name: clang-tidy
on: [push, pull_request]
jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install clang-tidy & dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cmake ninja-build
      - name: Configure CMake for compile_commands.json
        run: |
          cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -G Ninja
      - name: Run clang-tidy
        run: |
          clang-tidy -p build $(git ls-files "*.cpp" "*.h")
