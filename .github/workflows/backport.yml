name: backport
on:
  pull_request:
    types: [labeled]
    branches: [ main ]
    # Expect label "backport" with target branch name in description or comment.
jobs:
  backport:
    if: contains(github.event.pull_request.labels.*.name, 'backport')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Determine target branch
        id: target
        run: |
          # Assume the target branch is specified in PR body as "Backport to: <branch>"
          echo "$(jq -r '.pull_request.body' \"$GITHUB_EVENT_PATH\")" | grep -i "Backport to:" | cut -d':' -f2 | tr -d ' \n' > /tmp/branch
          echo "::set-output name=branch::$(cat /tmp/branch)"
      - name: Cherry-pick PR commits
        if: steps.target.outputs.branch != ''
        run: |
          git fetch origin ${{ steps.target.outputs.branch }}
          git checkout ${{ steps.target.outputs.branch }}
          git cherry-pick ${{ github.event.pull_request.merge_commit_sha }}
          git push origin ${{ steps.target.outputs.branch }}
